name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Não cancela o que está em andamento (o Pages pode ficar num estado
# inconsistente); um push novo espera e o push intermediário pendente é descartado.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Astro + service worker)
        run: |
          pnpm exec astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
          node scripts/generate-sw-manifest.mjs

      - name: Artifact size
        run: |
          echo "### Pages artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- $(find dist -type f | wc -l) arquivos, $(du -sh dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SW: $(grep -m1 -o "const VERSION = '[^']*'" dist/sw.js)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # Um deploy normal leva ~15 s. Às vezes o lado do GitHub Pages trava em "syncing_files" e o
      # passo só morre no timeout (foi o que derrubou os deploys de 09/11 e 10/11). Em vez de esperar
      # 10 min e falhar, desiste em 4 min e tenta de novo com o mesmo artefato.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 240000

      - name: Deploy to GitHub Pages (2ª tentativa)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
